name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke-test Ultraviolet startup
        run: |
          set -eu
          ALLOWED_HOSTS='*' PORT=3917 npm start > /tmp/schoolmathtime-startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if grep -q "Ultraviolet ready: true" /tmp/schoolmathtime-startup.log; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/schoolmathtime-startup.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/schoolmathtime-startup.log
          test "$ready" -eq 1
          curl --fail --silent http://127.0.0.1:3917/health | grep -q '"ultraviolet":true'
          curl --fail --silent http://127.0.0.1:3917/api/youtube/account | grep -q '"configured":false'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3917/auth/google/start)" = "503"
          curl --fail --silent http://127.0.0.1:3917/index.html | grep -q 'id="youtubeAccountConnect"'
          curl --fail --silent http://127.0.0.1:3917/youtube-account.js | grep -q 'Google sign-in needs setup'
          grep -q 'GOOGLE_OAUTH_CLIENT_SECRET' README.md
          grep -q 'code_challenge_method: "S256"' src/server.js
          grep -q 'GOOGLE_YOUTUBE_READONLY_SCOPE' src/server.js
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.html | grep -q 'Ultraviolet'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.html | grep -q 'youtube-login-1'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.html | grep -q 'youtube-login-1'
          curl --fail --silent http://127.0.0.1:3917/uv/uv.config.js | grep -q 'stm-uv-youtube-layout'
          grep -q 'id="uv-youtube-login"' public/ultraviolet.html
          grep -q 'accounts.google.com/ServiceLogin' public/ultraviolet.js
          grep -q 'Google blocked sign-in in this proxied browser' public/ultraviolet.js
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const vm = require("node:vm");
          const context = {
            self: {},
            Ultraviolet: { codec: { xor: { encode: (value) => value, decode: (value) => value } } }
          };
          vm.runInNewContext(fs.readFileSync("public/uv/uv.config.js", "utf8"), context);
          const config = context.self["__uv$config"];
          assert.ok(Array.isArray(config.inject));
          assert.ok(config.inject.some((item) => new RegExp(item.host).test("www.youtube.com")));
          assert.ok(config.inject.some((item) => new RegExp(item.host).test("youtube-nocookie.com")));
          assert.ok(!config.inject.some((item) => new RegExp(item.host).test("example.com")));
          NODE
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.html | grep -q 'id="classic-frame"'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'did not activate within 15 seconds'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'Trying both browser routes'
          grep -q 'Restore the common GET form workflow' src/server.js
          grep -q 'app.all("/tiktok-api"' src/server.js
          grep -q 'Chrome/148.0.0.0' src/server.js
          grep -q 'const TIKTOK_HOST_ROOTS' src/server.js
          grep -q 'var nativeFetch=window.fetch' src/server.js
          grep -q 'node|node-api|passport' src/server.js
          grep -q 'TikTok API upstream response:' src/server.js
          grep -q 'host=' src/server.js
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:3917/tiktok-api?url=https%3A%2F%2Fexample.com%2Fapi%2Ftest')" = "403"
          ALLOWED_HOSTS='tiktok.com' node - <<'NODE'
          const assert = require("node:assert/strict");
          const { isAllowedHost, isTikTokUpstreamHost, proxyDocument } = require("./src/server.js");
          assert.equal(isTikTokUpstreamHost("www.tiktok.com"), true);
          assert.equal(isTikTokUpstreamHost("api16-normal-useast5.us.tiktokv.com"), true);
          assert.equal(isAllowedHost("p16-common-sign.tiktokcdn-us.com"), true);
          assert.equal(isAllowedHost("example.com"), false);
          const html = proxyDocument("<!doctype html><html><head><title>TikTok</title><script src='/app.js'></script></head><body></body></html>", "https://www.tiktok.com/foryou", "");
          assert.match(html, /tiktok-api\?url=/);
          assert.match(html, /XMLHttpRequest\.prototype\.open/);
          assert.match(html, /window\.fetch/);
          NODE
          grep -q 'MAX_PAGE_BYTES = 8 \* 1024 \* 1024' src/server.js
          grep -q 'iframe.videodelivery.net' src/server.js
          grep -q 'Accept-Encoding": "gzip, br, deflate"' src/server.js
          grep -q 'createBrotliDecompress' src/server.js
          grep -q 'readRewrittenPageCache(rewrittenCacheKey)' src/server.js
          grep -q 'isLargeStaticAsset' src/server.js
          grep -q 'if (!transportReady)' public/ultraviolet.js
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.html | grep -q 'youtube-login-1'
          ! grep -q 'await navigator.serviceWorker.ready' public/ultraviolet.js
          curl --fail --silent http://127.0.0.1:3917/uv/sw.js > /dev/null
          curl --fail --silent http://127.0.0.1:3917/uv/uv.bundle.js > /dev/null
          curl --fail --silent http://127.0.0.1:3917/uv/uv.config.js | grep -q 'uv/service/'
          curl --fail --silent http://127.0.0.1:3917/uv/uv.config.js | grep -q 'sw: "/uv/uv.sw.js"'
          ! curl --fail --silent http://127.0.0.1:3917/uv/uv.config.js | grep -q 'sw: "/uv/sw.js"'
          curl --fail --silent http://127.0.0.1:3917/baremux/index.js > /dev/null
          curl --fail --silent 'http://127.0.0.1:3917/baremux/index.js?v=bare-mux-2-1-9' > /dev/null
          grep -q '"@mercuryworkshop/bare-mux": "2.1.9"' package.json
          grep -q 'bare-mux-2.1.9.tgz' package-lock.json
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'worker.js?v=bare-mux-2-1-9'
          curl --fail --silent http://127.0.0.1:3917/epoxy/index.mjs > /dev/null
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'wisp_v2: true'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'const transport = "/epoxy/index.mjs?build=wisp-mux-reset-1"'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'await connection.setTransport(transport'
          grep -q 'wispServer.options.wisp_version = 2' src/server.js
          grep -q 'wispServer.options.stream_limit_total = 128' src/server.js
          grep -q 'wispServer.options.stream_limit_per_host = -1' src/server.js
          grep -q '"googlevideo.com"' src/server.js
          grep -q '"youtubei.googleapis.com"' src/server.js
          grep -q 'const wispAllowedHosts = new Set(ALLOWED_HOSTS)' src/server.js
          curl --fail --silent --head http://127.0.0.1:3917/ultraviolet.html | grep -qi "content-security-policy:.*unsafe-eval"
          curl --fail --silent --head http://127.0.0.1:3917/baremux/worker.js | grep -qi "content-security-policy:.*unsafe-eval"
          ! curl --fail --silent --head http://127.0.0.1:3917/ | grep -qi "content-security-policy:.*unsafe-eval"
