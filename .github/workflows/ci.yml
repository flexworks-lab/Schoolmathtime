name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke-test Ultraviolet startup
        run: |
          set -eu
          ALLOWED_HOSTS='*' PORT=3917 npm start > /tmp/schoolmathtime-startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if grep -q "Ultraviolet ready: true" /tmp/schoolmathtime-startup.log; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/schoolmathtime-startup.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/schoolmathtime-startup.log
          test "$ready" -eq 1
          curl --fail --silent http://127.0.0.1:3917/health | grep -q '"ultraviolet":true'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.html | grep -q 'Ultraviolet'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.html | grep -q 'smart-race-1'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.html | grep -q 'id="classic-frame"'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'did not activate within 15 seconds'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'Trying both browser routes'
          grep -q 'Restore the common GET form workflow' src/server.js
          grep -q 'MAX_PAGE_BYTES = 8 \* 1024 \* 1024' src/server.js
          grep -q 'iframe.videodelivery.net' src/server.js
          ! grep -q 'await navigator.serviceWorker.ready' public/ultraviolet.js
          curl --fail --silent http://127.0.0.1:3917/uv/sw.js > /dev/null
          curl --fail --silent http://127.0.0.1:3917/uv/uv.bundle.js > /dev/null
          curl --fail --silent http://127.0.0.1:3917/uv/uv.config.js | grep -q 'uv/service/'
          curl --fail --silent http://127.0.0.1:3917/uv/uv.config.js | grep -q 'sw: "/uv/uv.sw.js"'
          ! curl --fail --silent http://127.0.0.1:3917/uv/uv.config.js | grep -q 'sw: "/uv/sw.js"'
          curl --fail --silent http://127.0.0.1:3917/baremux/index.js > /dev/null
          curl --fail --silent http://127.0.0.1:3917/epoxy/index.mjs > /dev/null
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'wisp_v2: true'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'const transport = "/epoxy/index.mjs?build=wisp-mux-reset-1"'
          curl --fail --silent http://127.0.0.1:3917/ultraviolet.js | grep -q 'await connection.setTransport(transport'
          grep -q 'wispServer.options.wisp_version = 2' src/server.js
          grep -q 'wispServer.options.stream_limit_total = 128' src/server.js
          grep -q 'wispServer.options.stream_limit_per_host = -1' src/server.js
          grep -q '"googlevideo.com"' src/server.js
          grep -q '"youtubei.googleapis.com"' src/server.js
          grep -q 'const wispAllowedHosts = new Set(ALLOWED_HOSTS)' src/server.js
          curl --fail --silent --head http://127.0.0.1:3917/ultraviolet.html | grep -qi "content-security-policy:.*unsafe-eval"
          curl --fail --silent --head http://127.0.0.1:3917/baremux/worker.js | grep -qi "content-security-policy:.*unsafe-eval"
          ! curl --fail --silent --head http://127.0.0.1:3917/ | grep -qi "content-security-policy:.*unsafe-eval"
